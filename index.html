<script>
    let html5QrCode = null;
    let busy = false;
    let cameraOn = false;
    let lastId = "";
    let lastTime = 0;

    // Escape text before putting it into innerHTML
    const esc = s => String(s).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    const setResult = html => { document.getElementById("result").innerHTML = html; };

    // --- BAGONG FUNCTION PARA MAGSALITA ANG PHONE ---
    function speakLoud(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Patigilin muna kung may nagsasalita pa para di magpatong-patong
        const speech = new SpeechSynthesisUtterance(text);
        speech.volume = 1; // Maximum volume sa code (0 to 1)
        speech.rate = 1;   // Normal speed ng salita
        speech.pitch = 1;  // Normal na boses
        window.speechSynthesis.speak(speech);
      }
    }

    async function startPhoneCamera() {
      setResult('<i class="fa-solid fa-spinner fa-spin me-2 text-warning"></i>Starting Phone Camera...');

      try {
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("reader");
        }
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          function (text) { processEmployeeId(text, true); },
          function () {}
        );
        cameraOn = true;
        document.getElementById("btnStartMobile").classList.add("d-none");
        setResult("Point phone camera at Employee QR Code");
      } catch (err) {
        setResult('<i class="fa-solid fa-triangle-exclamation text-danger me-2"></i>Camera permission denied. Allow camera access in your phone browser settings.');
      }
    }

    function submitManualId() {
      const val = document.getElementById("manualEmpId").value.trim();
      if (!val) return alert("Please enter an Employee ID.");
      processEmployeeId(val, false);
      document.getElementById("manualEmpId").value = "";
    }

    function finish() {
      busy = false;
      if (cameraOn) {
        setTimeout(function () {
          try { html5QrCode.resume(); } catch (e) {}
        }, 3000);
      }
    }

    function processEmployeeId(empId, fromCamera) {
      empId = String(empId).trim();
      if (busy) return;

      if (empId === lastId && Date.now() - lastTime < 60000) {
        if (!fromCamera) {
          setResult('<i class="fa-solid fa-clock text-warning me-2"></i>Already scanned. Please wait a minute.');
        }
        return;
      }

      busy = true;
      lastId = empId;
      lastTime = Date.now();

      if (cameraOn) {
        try { html5QrCode.pause(true); } catch (e) {}
      }

      setResult('<i class="fa-solid fa-spinner fa-spin me-2 text-warning"></i>Processing ID: ' + esc(empId));

      google.script.run
        .withSuccessHandler(function (res) {
          if (res.success) {
            const icon = res.action === "BREAK OUT"
              ? "fa-person-walking-arrow-right text-warning"
              : "fa-person-walking-arrow-loop text-success";

            // 1. LALABAS ANG "THANK YOU!" SA SCREEN
            setResult(
              '<h4 class="text-success mb-2 fw-bold" style="letter-spacing: 2px;">THANK YOU!</h4>' +
              '<i class="fa-solid ' + icon + ' me-2"></i>' + esc(res.name) + '<br>' +
              '<strong>' + esc(res.action) + '</strong> - ' + esc(res.time) +
              (res.duration !== undefined
                ? '<br><span class="text-info">Duration: ' + esc(res.duration) + ' mins</span>'
                : '')
            );

            // 2. MAGSASALITA ANG PHONE ("Thank you, Juan Dela Cruz")
            speakLoud("Thank you, " + res.name);

          } else {
            setResult('<i class="fa-solid fa-triangle-exclamation text-danger me-2"></i>' + esc(res.message));
          }
          finish();
        })
        .withFailureHandler(function (err) {
          lastId = ""; 
          setResult('<i class="fa-solid fa-xmark text-danger me-2"></i>Error: ' + esc(err.message));
          finish();
        })
        .scanEmployee(empId);
    }
  </script>
