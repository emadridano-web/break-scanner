<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Break Time Scanner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap');

    body {
      background: #000000 url('https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/2d77c594-f59b-483e-9b20-19b7f84ed21d/dmdpgmw-2e224476-bdd7-4b43-b80f-423ff25ca5f5.png/v1/fill/w_1280,h_715,q_80,strp/one_piece_luffy_4k_wallpaper_epic_anime_desktop_by_purewallfr_dmdpgmw-fullview.jpg?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNm4zNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7InBhdGgiOiIvZi8yZDc3YzU5NC1mNTliLTQ4M2UtOWIyMC0xOWI3Zjg0ZWQyMWQvZG1kcGdtdy0yZTIyNDQ3Ni1iZGQ3LTRiNDMtYjgwZi00MjNmZjI1Y2E1ZjUucG5nIiwiaGVpZ2h0IjoiPD03MTVsIiwid2lkdGgiOiI8PTEyODAifV1dLCJhdWQiOlsidXJuO3NlcnZpY2U6aW1hZ2Uud2F0ZXJtYXJrIl0sIndtayI6eyJwYXRoIjoiL3dtLzJkNzdjNTk0LWY1OWItNDgzZS05YjIwLTE5YjdmODRlZDIxZC9wdXJld2FsbGZyLTQucG5nIiwib3BhY2l0eSI6OTUsInByb3BvcnRpb25zIjowLjQ1LCJncmF2aXR5IjoiY2VudGVyIn19.AbZuC-PHMJCdQ0qerf0Roa4IS_6Vv5xNj40AVInj8nc') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Rajdhani', sans-serif;
      margin: 0; padding: 0;
      min-height: 100vh;
      display: flex; flex-direction: column;
      color: #ffffff;
    }
    body::before {
      content: ""; position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.45); z-index: -1;
    }
    .top-header {
      background: rgba(10, 5, 5, 0.85); backdrop-filter: blur(10px);
      border-bottom: 2px solid #ff2a00; box-shadow: 0 4px 20px rgba(255, 42, 0, 0.35);
    }
    h3 {
      font-family: 'Orbitron', sans-serif; letter-spacing: 1px; font-weight: 800;
      text-shadow: 0 0 10px rgba(255, 42, 0, 0.8), 0 2px 4px rgba(0, 0, 0, 0.9);
    }
    .bg-card {
      background: rgba(8, 4, 4, 0.75) !important; backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 42, 0, 0.4) !important; border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
    }
    #reader {
      width: 100%; max-width: 380px; margin: 0 auto;
      border: 2px solid rgba(255, 42, 0, 0.6); border-radius: 10px;
      overflow: hidden; background: #000; min-height: 250px;
    }
    #reader video { width: 100% !important; height: auto !important; }
    #reader.mirror video { transform: scaleX(-1); }
    #camSelect { background-color: rgba(10, 5, 5, 0.85); color: #fff; border: 1px solid rgba(255, 193, 7, 0.7); }
    #file-reader { position: absolute; left: -9999px; width: 300px; height: 300px; }
    .result-box {
      font-family: 'Orbitron', sans-serif; font-size: 1.15rem;
      background: rgba(15, 5, 5, 0.85); border: 1px solid rgba(255, 42, 0, 0.5);
      border-radius: 8px; padding: 15px; margin-top: 15px;
      text-shadow: 0 0 8px rgba(255, 42, 0, 0.7);
    }
    .form-control {
      background-color: rgba(10, 5, 5, 0.85) !important;
      border: 1px solid rgba(255, 42, 0, 0.5); color: #fff !important;
    }
    .form-control::placeholder { color: rgba(255, 255, 255, 0.6); }
    .btn-mobile { padding: 12px; font-size: 1.1rem; font-family: 'Orbitron', sans-serif; font-weight: 700; }
  </style>
</head>
<body>
  <header class="top-header p-3 text-center">
    <h3 class="m-0"><i class="fa-solid fa-mobile-screen me-2"></i>PHONE QR SCANNER</h3>
    <small>Mega Prime Foods Inc. - Break Time Logger</small>
    <div><small class="text-warning">v8</small></div>
  </header>

  <div class="container py-3 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="p-3 p-md-4 bg-card text-center">

          <div id="warn" class="alert alert-warning small text-start d-none"></div>

          <div id="reader" class="mb-3"></div>
          <div id="file-reader"></div>
          <div id="camInfo" class="small text-warning mb-2"></div>

          <button id="btnStart" class="btn btn-danger w-100 btn-mobile mb-2" onclick="startCamera()">
            <i class="fa-solid fa-camera me-2"></i>TAP TO OPEN PHONE CAMERA
          </button>
          <button id="btnSwitch" class="btn btn-warning w-100 mb-2 d-none" onclick="switchCamera()">
            <i class="fa-solid fa-camera-rotate me-2"></i><span id="switchLabel">Switch Camera</span>
          </button>
          <div id="camPicker" class="text-start mb-2 d-none">
            <label class="form-label small text-warning mb-1"><i class="fa-solid fa-video me-1"></i>Choose camera</label>
            <select id="camSelect" class="form-select" onchange="chooseCamera(this.value)"></select>
          </div>
          <button id="btnStop" class="btn btn-outline-light w-100 mb-2 d-none" onclick="stopCamera()">
            <i class="fa-solid fa-stop me-2"></i>Stop Camera
          </button>

          <label class="btn btn-outline-warning w-100 mb-3">
            <i class="fa-solid fa-image me-2"></i>Camera not working? Take a photo of the QR
            <input type="file" id="qrPhoto" accept="image/*" capture="user" hidden onchange="scanPhoto(this)">
          </label>

          <div class="mt-2 text-start border-top border-secondary pt-3">
            <label class="form-label small text-light"><i class="fa-solid fa-keyboard me-1 text-warning"></i>Manual Employee ID Backup</label>
            <div class="input-group">
              <input type="text" id="manualEmpId" class="form-control" placeholder="Enter ID (e.g. 001)"
                     inputmode="numeric" onkeydown="if(event.key==='Enter') submitManualId()">
              <button class="btn btn-outline-danger" onclick="submitManualId()"><i class="fa-solid fa-arrow-right"></i> Log</button>
            </div>
          </div>

          <!-- Forgot to Break In (needs supervisor PIN) -->
          <div class="mt-3 text-start">
            <button class="btn btn-sm btn-outline-info w-100" type="button" onclick="toggleFix()">
              <i class="fa-solid fa-clock-rotate-left me-1"></i>Forgot to Break In?
            </button>
            <div id="fixBox" class="d-none mt-2 p-2 border border-info rounded">
              <div class="small text-info mb-2">For employees still ON BREAK who forgot to scan back in. Enter the ACTUAL time they came back.</div>
              <input type="text" id="fixId" class="form-control mb-2" placeholder="Employee ID" inputmode="numeric">
              <label class="form-label small text-light mb-1">Actual break-in time</label>
              <input type="time" id="fixTime" class="form-control mb-2">
              <input type="password" id="fixPin" class="form-control mb-2" placeholder="Supervisor PIN" inputmode="numeric">
              <button class="btn btn-info w-100" type="button" onclick="submitFix()">
                <i class="fa-solid fa-floppy-disk me-1"></i>Save Break In
              </button>
            </div>
          </div>

          <div id="result" class="result-box"><i class="fa-solid fa-hand-pointer me-2 text-warning"></i>Tap the red button above to start your phone camera.</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // PASTE YOUR APPS SCRIPT /exec URL HERE
    const API_URL = "https://script.google.com/macros/s/AKfycby5_30Te50gyAWRbhWNZmH_uWlKtDSy_IT2R7y7SuRjec79Uh2p6ofoOtrzv7vDYDXPvw/exec";

    let scanner = null;       // live camera scanner
    let fileScanner = null;   // photo scanner
    let busy = false, cameraOn = false, restartOnReturn = false;
    // "user" = FRONT camera, "environment" = BACK camera
    let facing = "user";   // always open the FRONT camera first
    try { localStorage.removeItem("facing"); localStorage.removeItem("camId"); } catch (e) {}
    let lastId = "", lastTime = 0;
    let audioCtx = null;

    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const icon = cls => '<i class="fa-solid ' + cls + ' me-2"></i>';
    const setResult = html => { $("result").innerHTML = html; };
    const SPIN = icon("fa-spinner fa-spin text-warning");
    const ERR = icon("fa-triangle-exclamation text-danger");

    // Works in both places: inside Apps Script (/exec) and on GitHub Pages
    function inAppsScript() {
      return typeof google !== "undefined" && google.script && google.script.run;
    }
    function callServer(id) {
      if (inAppsScript()) {
        return new Promise(function (resolve, reject) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .scanEmployee(id);
        });
      }
      return fetch(API_URL + "?id=" + encodeURIComponent(id))
        .then(function (r) { return r.text(); })
        .then(function (t) {
          try { return JSON.parse(t); }
          catch (e) { throw new Error("NOT_JSON"); }
        });
    }

    /* ---------- Environment checks ---------- */
    window.addEventListener("load", function () {
      const ua = navigator.userAgent || "";
      const warn = [];
      if (!inAppsScript() && API_URL.indexOf("PASTE_YOUR_ID_HERE") !== -1) {
        warn.push("Setup needed: put your Apps Script <b>/exec</b> URL in <b>API_URL</b> inside index.html.");
      }
      if (typeof Html5Qrcode === "undefined") {
        warn.push("Scanner library failed to load. Check your internet connection and reload.");
      }
      if (/FBAN|FBAV|FB_IAB|Messenger|Instagram|Line\/|TikTok/i.test(ua)) {
        warn.push("You opened this inside Messenger/Facebook, which blocks the camera. " +
                  "Tap the <b>&#8942;</b> or <b>&hellip;</b> menu and choose <b>Open in Chrome</b> (Android) or <b>Open in Safari</b> (iPhone).");
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        warn.push("This browser can't open a live camera. Use the <b>Take a photo of the QR</b> button instead.");
      }
      if (warn.length) {
        $("warn").innerHTML = warn.join("<br><br>");
        $("warn").classList.remove("d-none");
      }
    });

    function cameraErrorMessage(err) {
      const text = String((err && (err.name + ": " + err.message)) || err);
      if (/NotAllowed|Permission|denied/i.test(text))
        return "Camera permission is blocked. Tap the lock icon in the address bar > Permissions > Camera > Allow, then reload the page.";
      if (/NotFound|no camera|Requested device not found/i.test(text))
        return "No camera found on this device.";
      if (/NotReadable|in use|Could not start/i.test(text))
        return "Camera is being used by another app. Close other camera apps and try again.";
      if (/secure|https/i.test(text))
        return "Camera needs a secure (https) page.";
      return "Could not start camera (" + text + "). Use the photo button below instead.";
    }

    /* ---------- Sound / vibration ---------- */
    function unlockAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
      } catch (e) {}
    }
    function feedback(ok) {
      try { if (navigator.vibrate) navigator.vibrate(ok ? 120 : [80, 60, 80]); } catch (e) {}
      try {
        if (!audioCtx) return;
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = ok ? 880 : 220;
        g.gain.value = 0.15;
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + 0.15);
      } catch (e) {}
    }

    /* ---------- Live camera ---------- */
    function newScanner() {
      try { if (scanner) scanner.clear(); } catch (e) {}
      scanner = new Html5Qrcode("reader", {
        formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
        experimentalFeatures: { useBarCodeDetectorIfSupported: true },
        verbose: false
      });
    }

    // Camera picked from the list (remembered on this device)
    let camId = "";
    try { camId = localStorage.getItem("frontCamId") || ""; } catch (e) {}

    const scanConfig = {
      fps: 25,              // read up to 25 times per second (was 10)
      disableFlip: true,    // skip mirrored decoding = faster
      qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.8); return { width: s, height: s }; }
    };
    const onScan = text => processEmployeeId(text, true);

    async function tryStart(source) {
      newScanner();
      await scanner.start(source, scanConfig, onScan, () => {});
    }

    async function startCamera() {
      unlockAudio();
      if (typeof Html5Qrcode === "undefined") {
        return setResult(ERR + "Scanner library not loaded. Reload the page.");
      }
      setResult(SPIN + "Starting camera...");
      $("btnStart").disabled = true;

      try {
        let started = false, lastErr = null;

        // 1. The camera chosen from the list last time
        if (camId) {
          try { await tryStart(camId); started = true; }
          catch (e) { lastErr = e; camId = ""; }
        }
        // 2. Front / back by facing mode (forced first, then normal)
        if (!started) {
          try { await tryStart({ facingMode: { exact: facing } }); started = true; }
          catch (e) { lastErr = e; }
        }
        if (!started) {
          try { await tryStart({ facingMode: facing }); started = true; }
          catch (e) { lastErr = e; }
        }
        // 3. Pick from the device list by name
        if (!started) {
          const cams = await Html5Qrcode.getCameras();
          if (!cams || !cams.length) throw lastErr || new Error("NotFoundError");
          const want = facing === "user" ? /front|user|face|selfie/i : /back|rear|environment/i;
          const pick = cams.find(c => want.test(c.label)) || (facing === "user" ? cams[0] : cams[cams.length - 1]);
          await tryStart(pick.id);
        }

        if (facing === "user" && !camId) await ensureFront();

        cameraOn = true;
        $("btnStart").classList.add("d-none");
        $("btnStop").classList.remove("d-none");
        $("btnSwitch").classList.remove("d-none");
        await fillCameraList();
        updateCameraUi();
        setResult(icon("fa-qrcode text-warning") + "Point the camera at the Employee QR code");
      } catch (err) {
        cameraOn = false;
        setResult(ERR + esc(cameraErrorMessage(err)));
      } finally {
        $("btnStart").disabled = false;
      }
    }

    // Some tablets open the back camera even when asked for the front one.
    // Check what actually opened, and move to the front camera if needed.
    async function ensureFront() {
      let actual = "", currentId = "";
      try {
        const t = scanner.getRunningTrackSettings();
        actual = t.facingMode || "";
        currentId = t.deviceId || "";
      } catch (e) {}
      if (actual === "user") return;   // already front

      let cams = [];
      try {
        cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
      } catch (e) { return; }
      if (cams.length < 2) return;

      const labeledFront = cams.find(d => /front|user|face|selfie/i.test(d.label));
      let target = null;
      if (labeledFront && labeledFront.deviceId !== currentId) target = labeledFront;
      else if (actual === "environment") target = cams.find(d => d.deviceId !== currentId);
      if (!target) return;

      try { await scanner.stop(); } catch (e) {}
      try { await tryStart(target.deviceId); }
      catch (e) { await tryStart({ facingMode: "user" }); }
    }

    // Fill the "Choose camera" dropdown with every camera on the device
    async function fillCameraList() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter(d => d.kind === "videoinput");
        const sel = $("camSelect");
        sel.innerHTML = cams.map(function (c, i) {
          return '<option value="' + esc(c.deviceId) + '">' + esc(c.label || ("Camera " + (i + 1))) + '</option>';
        }).join("");
        let current = "";
        try { current = scanner.getRunningTrackSettings().deviceId || ""; } catch (e) {}
        if (current) sel.value = current;
        $("camPicker").classList.toggle("d-none", cams.length < 1);
      } catch (e) {}
    }

    async function chooseCamera(id) {
      if (!id) return;
      camId = id;
      try { localStorage.setItem("frontCamId", id); } catch (e) {}
      await stopCamera();
      startCamera();
    }

    async function stopCamera() {
      if (scanner && cameraOn) { try { await scanner.stop(); } catch (e) {} }
      cameraOn = false;
      $("btnStop").classList.add("d-none");
      $("btnSwitch").classList.add("d-none");
      $("camPicker").classList.add("d-none");
      $("camInfo").textContent = "";
      $("btnStart").classList.remove("d-none");
    }

    function updateCameraUi() {
      let actual = "";
      try { actual = scanner.getRunningTrackSettings().facingMode || ""; } catch (e) {}
      const isFront = actual ? actual === "user" : facing === "user";
      $("reader").classList.toggle("mirror", isFront);
      $("switchLabel").textContent = isFront ? "Switch to Back Camera" : "Switch to Front Camera";
      $("qrPhoto").setAttribute("capture", isFront ? "user" : "environment");

      let label = "";
      try {
        const id = scanner.getRunningTrackSettings().deviceId;
        const opt = Array.from($("camSelect").options).find(o => o.value === id);
        label = opt ? opt.textContent : "";
      } catch (e) {}
      $("camInfo").textContent = "Camera: " + (label || "unknown") +
        " | facing: " + (actual || "not reported");
    }

    async function switchCamera() {
      let actual = "";
      try { actual = scanner.getRunningTrackSettings().facingMode || ""; } catch (e) {}
      const isFront = actual ? actual === "user" : facing === "user";
      facing = isFront ? "environment" : "user";
      camId = "";   // this session only; next time the page opens it starts with FRONT again
      await stopCamera();
      startCamera();
    }

    // Phones stop the camera when the screen locks or you switch apps; restart on return
    document.addEventListener("visibilitychange", async function () {
      if (document.hidden && cameraOn) {
        restartOnReturn = true;
        await stopCamera();
      } else if (!document.hidden && restartOnReturn) {
        restartOnReturn = false;
        startCamera();
      }
    });

    /* ---------- Photo fallback ---------- */
    async function scanPhoto(input) {
      unlockAudio();
      const file = input.files && input.files[0];
      input.value = "";
      if (!file) return;
      setResult(SPIN + "Reading QR code from photo...");
      try {
        if (!fileScanner) {
          fileScanner = new Html5Qrcode("file-reader", {
            formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
            experimentalFeatures: { useBarCodeDetectorIfSupported: true },
            verbose: false
          });
        }
        const text = await fileScanner.scanFile(file, false);
        processEmployeeId(text, false);
      } catch (e) {
        feedback(false);
        setResult(ERR + "No QR code found in the photo. Hold steady, fill the frame with the QR code, and try again.");
      }
    }

    /* ---------- Manual entry ---------- */
    function submitManualId() {
      unlockAudio();
      const val = $("manualEmpId").value.trim();
      if (!val) return setResult(ERR + "Please enter an Employee ID.");
      processEmployeeId(val, false);
      $("manualEmpId").value = "";
    }

    /* ---------- Send to Apps Script ---------- */
    // Camera keeps running; we only ignore new scans until the server answers
    function finish() {
      busy = false;
    }

    function showServerResult(res) {
      if (res && res.success) {
        const out = res.action === "BREAK OUT";
        let html = icon(out ? "fa-person-walking-arrow-right text-warning"
                            : "fa-person-walking-arrow-loop text-success") +
                   esc(res.name) + "<br><strong>" + esc(res.action) + "</strong> - " + esc(res.time);
        if (!out) html += '<br><span class="text-info">Duration: ' + esc(res.duration) + " mins</span>";
        if (res.remarks) html += '<br><span class="text-danger">' + esc(res.remarks) + "</span>";
        setResult(html);
        feedback(true);
      } else {
        setResult(ERR + esc(res ? res.message : "Unknown error"));
        feedback(false);
      }
    }

    /* ---------- Forgot to Break In ---------- */
    function toggleFix() {
      $("fixBox").classList.toggle("d-none");
    }

    async function submitFix() {
      unlockAudio();
      const id = $("fixId").value.trim();
      const time = $("fixTime").value;
      const pin = $("fixPin").value.trim();
      if (!id || !time || !pin) {
        return setResult(ERR + "Fill in Employee ID, actual break-in time and supervisor PIN.");
      }
      setResult(SPIN + "Saving break in for ID: " + esc(id));
      try {
        let res;
        if (inAppsScript()) {
          res = await new Promise(function (resolve, reject) {
            google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)
              .fixBreakIn(id, time, pin);
          });
        } else {
          const url = API_URL + "?fix=in&id=" + encodeURIComponent(id) +
                      "&time=" + encodeURIComponent(time) + "&pin=" + encodeURIComponent(pin);
          const t = await (await fetch(url)).text();
          try { res = JSON.parse(t); } catch (e) { throw new Error("NOT_JSON"); }
        }
        showServerResult(res);
        if (res && res.success) {
          $("fixId").value = ""; $("fixTime").value = ""; $("fixPin").value = "";
          $("fixBox").classList.add("d-none");
        }
      } catch (err) {
        setResult(icon("fa-xmark text-danger") +
          "Could not save. Check internet and that the Apps Script deployment access is 'Anyone'.");
        feedback(false);
      }
    }

    async function processEmployeeId(empId, fromCamera) {
      empId = String(empId).trim();
      if (!empId || busy) return;

      if (empId === lastId && Date.now() - lastTime < 60000) {
        if (!fromCamera) setResult(icon("fa-clock text-warning") + "Already scanned. Please wait a minute.");
        return;
      }

      busy = true;
      lastId = empId;
      lastTime = Date.now();

      setResult(SPIN + "Processing ID: " + esc(empId));

      try {
        const res = await callServer(empId);

        showServerResult(res);
      } catch (err) {
        lastId = ""; // allow an immediate retry
        let msg;
        if (!navigator.onLine) {
          msg = "No internet connection. Check Wi-Fi and try again.";
        } else if (err && err.message === "NOT_JSON") {
          msg = "Apps Script answered with a page instead of data. Make sure the deployment is set to 'Who has access: Anyone' and deploy a New version.";
        } else {
          msg = "Cannot reach Apps Script. Check that the deployment access is 'Anyone' (not only megasardines.com), then try again.";
        }
        setResult(icon("fa-xmark text-danger") + esc(msg));
        feedback(false);
      }
      finish();
    }
  </script>
</body>
</html>
